      --success: #12875A;
      --success-bg: #E7F6EF;
      --warning: #B25E09;
      --warning-bg: #FDF1E1;
      --danger: #C22E2E;

      --info: #2F5CFF;

    * {

    }

    html,
    body,
    #root {
      height: 100%;
      margin: 0
    }

    body {

      font-size: 13.5px;
      line-height: 1.5;
      color: var(--ink-900);
      background: var(--surface-0);
      -webkit-font-smoothing: antialiased

    button {

      cursor: pointer
    }

    input,
    textarea,
    select {
      font-family: inherit;
      font-size: inherit
    }

    .mono {
      font-family: var(--font-mono);
      font-feature-settings: "tnum"
    }

    .tnum {
      font-variant-numeric: tabular-nums
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--ink-200);
      border-radius: 8px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--ink-900);
      font-weight: 600;
      font-size: 13px;
      transition: background .12s
    }

    .btn:hover {
      background: var(--surface-0)
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .btn-primary:hover {
      background: var(--accent);
      filter: brightness(1.08)
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent
    }

    .btn-ghost:hover {
      background: var(--surface-0)
    }

    .btn-sm {
      height: 28px;
      padding: 0 10px;
      font-size: 12px
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0
    }

    .btn-block {
      width: 100%
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-1);
      color: var(--ink-900)
    }

    .textarea {
      height: auto;
      padding: 8px 10px;
      min-height: 64px;
      resize: vertical
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-tint)
    }

    .card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-card)
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-400)
    }

    .h-title {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em
    }

    .muted {
      color: var(--ink-600)
    }

    .faint {
      color: var(--ink-400)
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600
    }

    .pill-accent {
      background: var(--accent-tint);
      color: var(--accent)
    }

    .pill-ink {
      background: #EEF0F3;
      color: var(--ink-700)
    }

    .pill-success {
      background: var(--success-bg);
      color: var(--success)
    }

    .pill-warning {
      background: var(--warning-bg);
      color: var(--warning)
    }

    .pill-danger {
      background: var(--danger-bg);
      color: var(--danger)
    }

    .pill-info {
      background: var(--info-bg);
      color: var(--info)
    }

    .fade-in {
      animation: fadeIn .2s ease-out
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    table {
      border-collapse: collapse
    }
  </style>
</head>

        case 'SELECT_CONV': return { ...s, selectedConvId: a.id };
        case 'SEND_MSG': {
          const conv = s.conversations.find(c => c.id === a.id);
          if (!conv) return s;
          const msg = { id: uid('m'), sender: conv.status === 'human' ? 'human' : 'customer', text: a.text, time: 'now', agent: conv.status === 'human' ? 'MS' : null };
          return { ...s, conversations: s.conversations.map(c => c.id === a.id ? { ...c, messages: [...c.messages, msg], lastTime: 'now' } : c) };
        }
        case 'AI_REPLY': return { ...s, conversations: s.conversations.map(c => c.id === a.id ? { ...c, messages: [...c.messages, { id: uid('m'), sender: 'ai', text: a.text, time: 'now' }] } : c) };
        case 'TAKE_OVER': return { ...s, conversations: s.conversations.map(c => c.id === a.id ? { ...c, status: 'human', messages: [...c.messages, { id: uid('m'), sender: 'system', text: 'You are now handling this conversation.', time: 'now' }] } : c) };

        case 'CREATE_ORDER': {
          const id = String(1049);

        }
        case 'SEND_LOGISTICS': return { ...s, orders: s.orders.map(o => o.id === a.id ? { ...o, status: 'Processing' } : o) };
        case 'CREATE_APPT': {
          const id = 'A-1043';
          const appt = { ...a.appt, id, status: 'Confirmed', createdAt: '2024-08-17 now' };

            <table style={{ width: '100%', fontSize: 13 }}>
              <thead><tr style={{ borderBottom: '1px solid var(--border)', textAlign: 'left' }}>
                {['Order', 'Customer', 'Product', 'Qty', 'Total', 'Channel', 'Status'].map(h => <th key={h} style={{ padding: '10px 12px', fontWeight: 600, color: 'var(--ink-600)', fontSize: 12 }}>{h}</th>)}
              </tr></thead>
              <tbody>
                {orders.map(o => {
                  const c = customers.find(x => x.id === o.customerId);
                  const p = products.find(x => x.id === o.productId);
                  return (
                    <tr key={o.id} style={{ borderBottom: '1px solid var(--border)' }}>
                      <td style={{ padding: '10px 12px' }} className="mono">#{o.id}</td>
                      <td style={{ padding: '10px 12px' }}><div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><Avatar name={c.name} size={26} />{c.name}</div></td>
                      <td style={{ padding: '10px 12px' }}>{p.name} · {o.variant}</td>
                      <td style={{ padding: '10px 12px' }} className="tnum">{o.qty}</td>
                      <td style={{ padding: '10px 12px', fontWeight: 600 }} className="tnum">{o.total.toLocaleString()} EGP</td>
                      <td style={{ padding: '10px 12px' }}><ChannelGlyph ch={o.channel} size={14} /></td>
                      <td style={{ padding: '10px 12px' }}><StatusBadge status={o.status} /></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {open && <OrderDrawer onClose={() => setOpen(false)} />}
        </div>
      );
    };
    const Appointments = () => {
      const { appointments, customers, services } = useApp();
      const [open, setOpen] = useState(false);
      return (
        <div style={{ padding: 24 }}>
          <div style={{ display: 'flex', marginBottom: 16 }}>
            <button className="btn btn-primary" style={{ marginLeft: 'auto' }} onClick={() => setOpen(true)}>{I.Plus(14)} New Appointment</button>
          </div>
          <div className="card" style={{ overflow: 'auto' }}>
            <table style={{ width: '100%', fontSize: 13 }}>
              <thead><tr style={{ borderBottom: '1px solid var(--border)', textAlign: 'left' }}>
                {['ID', 'Patient', 'Service', 'Date', 'Channel', 'Status'].map(h => <th key={h} style={{ padding: '10px 12px', fontWeight: 600, color: 'var(--ink-600)', fontSize: 12 }}>{h}</th>)}
              </tr></thead>
              <tbody>
                {appointments.map(a => {
                  const c = customers.find(x => x.id === a.customerId);
                  const s = services.find(x => x.id === a.serviceId);
                  return (
                    <tr key={a.id} style={{ borderBottom: '1px solid var(--border)' }}>
                      <td style={{ padding: '10px 12px' }} className="mono">{a.id}</td>
                      <td style={{ padding: '10px 12px' }}><div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><Avatar name={c.name} size={26} />{c.name}</div></td>
                      <td style={{ padding: '10px 12px' }}>{s.name}</td>
                      <td style={{ padding: '10px 12px' }} className="mono">{a.date} · {a.time}</td>
                      <td style={{ padding: '10px 12px' }}><ChannelGlyph ch={a.channel} size={14} /></td>
                      <td style={{ padding: '10px 12px' }}><StatusBadge status={a.status} /></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {open && <BookingDrawer onClose={() => setOpen(false)} />}
        </div>
      );
    };

    /* ===== AUTOMATIONS ===== */
    const Automations = () => {
      const { automations, vertical, dispatch } = useApp();
      const [expanded, setExpanded] = useState(null);
      const active = automations.filter(a => a.vertical === vertical);
      const comingSoon = ['Broadcast Campaigns', 'Cross-merchant Trust Network', 'Courier API Integration', 'Advanced COD Intelligence', 'No-show Prediction'];
      return (
        <div style={{ padding: 24 }}>
          <h1 style={{ fontSize: 20, fontWeight: 650, marginBottom: 16 }}>Automations</h1>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16 }}>
            {active.map(a => (
              <div key={a.id} className="card" style={{ padding: 16, opacity: a.enabled ? 1 : 0.6 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                  <div style={{ fontWeight: 650, fontSize: 14 }}>{a.name}</div>
                  <Toggle checked={a.enabled} onChange={() => dispatch({ type: 'TOGGLE_AUTOMATION', id: a.id })} />
                </div>
                <div className="muted" style={{ fontSize: 12, marginBottom: 8 }}>{a.desc}</div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <StatusBadge status={a.enabled ? 'Active' : 'Paused'} />
                  <button style={{ background: 'transparent', border: 'none', color: 'var(--accent)', fontWeight: 600, fontSize: 12, cursor: 'pointer' }} onClick={() => setExpanded(expanded === a.id ? null : a.id)}>{expanded === a.id ? 'Hide flow' : 'View flow'}</button>
                </div>
                {expanded === a.id && (
                  <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                    {a.steps.map((s, i) => (
                      <React.Fragment key={i}>
                        <div style={{ width: 120, height: 40, borderRadius: 8, background: 'var(--accent-tint)', color: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, textAlign: 'center', padding: '0 8px' }}>{s}</div>
                        {i < a.steps.length - 1 && <span style={{ color: 'var(--ink-400)' }}>{I.Chevron(14)}</span>}
                      </React.Fragment>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
          <div style={{ marginTop: 32 }}>
            <div className="eyebrow" style={{ marginBottom: 12 }}>Coming soon</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16 }}>
              {comingSoon.map(c => (
                <div key={c} className="card" style={{ padding: 16, opacity: 0.55, position: 'relative' }}>
                  <span className="pill pill-ink" style={{ position: 'absolute', top: 12, right: 12 }}>Coming Soon</span>
                  <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 4 }}>{c}</div>
                  <div className="faint" style={{ fontSize: 12 }}>In development — not available in this prototype.</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    /* ===== KNOWLEDGE ===== */
    const Knowledge = () => {
      const faqs = [
        { id: 'F-1', q: 'How long does delivery take?', a: 'Cairo 1-2 business days, governorates 3-4 business days.', c: 'Delivery' },
        { id: 'F-2', q: 'What is your return policy?', a: 'Returns within 14 days, unused and in original packaging.', c: 'Returns' },
        { id: 'F-3', q: 'Which payment methods do you accept?', a: 'Cash on Delivery nationwide. Card payments coming soon.', c: 'Payment' },
      ];
      const sources = [
        { id: 'KS-1', name: 'Product-Catalog-2024.pdf', type: 'pdf', used: true },
        { id: 'KS-2', name: 'Shipping-and-Returns.docx', type: 'docx', used: true },
        { id: 'KS-3', name: 'Storefront-FAQs.txt', type: 'text', used: true },
        { id: 'KS-4', name: 'Brand-Policy.pdf', type: 'pdf', used: false },
      ];
      return (
        <div style={{ padding: 24 }}>
          <h1 style={{ fontSize: 20, fontWeight: 650, marginBottom: 16 }}>Knowledge Base</h1>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 320px', gap: 16 }}>
            <div className="card" style={{ padding: 16 }}>
              <div style={{ fontSize: 15, fontWeight: 650, marginBottom: 12 }}>FAQs</div>
              {faqs.map(f => (
                <div key={f.id} className="card" style={{ padding: 12, marginBottom: 8 }}>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{f.q}</div>
                  <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>{f.a}</div>
                  <span className="pill pill-ink" style={{ marginTop: 6 }}>{f.c}</span>
                </div>
              ))}
            </div>
            <div className="card" style={{ padding: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                <div style={{ fontSize: 15, fontWeight: 650 }}>Sources</div>
                <button className="btn btn-ghost btn-sm">{I.Upload(12)} Upload</button>
              </div>
              {sources.map(s => (
                <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid var(--surface-0)' }}>
                  <span style={{ color: 'var(--ink-400)', display: 'inline-flex' }}>{I.Book(16)}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.name}</div>
                    <div className="faint" style={{ fontSize: 11, textTransform: 'uppercase' }}>{s.type}</div>
                  </div>
                  {s.used && <span title="AI is using this" style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--accent)' }} />}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    /* ===== ANALYTICS ===== */
    const Analytics = () => {
      const { vertical } = useApp();
      const isAppt = vertical === 'appointments';
      const [range, setRange] = useState('7d');
      const data = range === '7d' ? [40, 55, 38, 62, 50, 72, 68] : range === '30d' ? Array.from({ length: 30 }, (_, i) => 40 + i * 2) : Array.from({ length: 90 }, (_, i) => 30 + i);
      const shared = [
        { eyebrow: 'Total Conversations', value: isAppt ? '436' : '1,248', trend: { value: '8%', up: true } },
        { eyebrow: 'Leads', value: isAppt ? '82' : '184', trend: { value: '12%', up: true } },
        { eyebrow: 'Conversion Rate', value: isAppt ? '22.5%' : '18.4%', trend: { value: '2%', up: true } },
        { eyebrow: 'AI Resolution Rate', value: isAppt ? '74%' : '78%', trend: { value: '4%', up: true } },
      ];
      return (
        <div style={{ padding: 24 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
            <h1 style={{ fontSize: 20, fontWeight: 650 }}>Analytics</h1>
            <div style={{ display: 'inline-flex', background: 'var(--surface-0)', borderRadius: 6, padding: 2 }}>
              {['7d', '30d', '90d'].map(r => (
                <button key={r} onClick={() => setRange(r)} style={{ border: 'none', background: range === r ? 'var(--surface-1)' : 'transparent', height: 26, padding: '0 10px', borderRadius: 5, fontWeight: 600, fontSize: 12, boxShadow: range === r ? 'var(--shadow-card)' : 'none', cursor: 'pointer' }}>{r}</button>
              ))}
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 16, marginBottom: 16 }}>
            {shared.map(s => <StatCard key={s.eyebrow} eyebrow={s.eyebrow} value={s.value} trend={s.trend} />)}
          </div>
          <div className="card" style={{ padding: 16, marginBottom: 16 }}>
            <div style={{ fontSize: 15, fontWeight: 650, marginBottom: 12 }}>{isAppt ? 'Bookings over time' : 'Revenue over time'}</div>
            <LineChart data={data} height={240} />
          </div>
        </div>
      );
    };

    /* ===== SETTINGS ===== */
    const Settings = () => {
      const { settings, dispatch, toast } = useApp();
      const [sec, setSec] = useState('Business Profile');
      const [bizName, setBizName] = useState(settings.businessName);
      const [dirty, setDirty] = useState(false);
      const sections = ['Business Profile', 'Channels', 'AI Settings', 'Working Hours', 'Notifications', 'Team Members'];
      return (
        <div style={{ padding: 24, display: 'flex', gap: 16 }}>
          <div className="card" style={{ width: 220, padding: 8, height: 'fit-content', flexShrink: 0 }}>
            {sections.map(s => (
              <button key={s} onClick={() => setSec(s)} style={{ width: '100%', textAlign: 'left', padding: '8px 10px', borderRadius: 6, background: sec === s ? 'var(--accent-tint)' : 'transparent', color: sec === s ? 'var(--accent)' : 'var(--ink-700)', fontWeight: sec === s ? 600 : 500, fontSize: 13, border: 'none', cursor: 'pointer' }}>{s}</button>
            ))}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            {sec === 'Business Profile' && (
              <div className="card" style={{ padding: 20 }}>
                <h2 style={{ fontSize: 15, fontWeight: 650, marginBottom: 16 }}>Business Profile</h2>
                <div style={{ marginBottom: 12 }}>
                  <div className="eyebrow" style={{ marginBottom: 6 }}>Business name</div>
                  <input className="input" value={bizName} onChange={e => { setBizName(e.target.value); setDirty(true); }} />
                </div>
                {dirty && (
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                    <button className="btn" onClick={() => { setBizName(settings.businessName); setDirty(false); }}>Cancel</button>
                    <button className="btn btn-primary" onClick={() => { dispatch({ type: 'UPDATE_BIZ', name: bizName }); setDirty(false); toast({ kind: 'success', text: 'Profile saved' }); }}>Save changes</button>
                  </div>
                )}
              </div>
            )}
            {sec === 'Channels' && (
              <div className="card" style={{ padding: 20 }}>
                <h2 style={{ fontSize: 15, fontWeight: 650, marginBottom: 16 }}>Channels</h2>
                {['instagram', 'whatsapp', 'facebook', 'tiktok', 'website'].map(c => (
                  <div key={c} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 0', borderBottom: '1px solid var(--border)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                      <ChannelGlyph ch={c} size={20} />
                      <span style={{ textTransform: 'capitalize', fontWeight: 600 }}>{c}</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <StatusBadge status={settings.channels[c] ? 'Active' : 'Paused'} />
                      <button className={'btn btn-sm ' + (settings.channels[c] ? '' : 'btn-primary')} onClick={() => { dispatch({ type: 'TOGGLE_CHANNEL', ch: c }); toast({ kind: settings.channels[c] ? 'warning' : 'success', text: c + ' ' + (settings.channels[c] ? 'disconnected' : 'connected') }); }}>{settings.channels[c] ? 'Disconnect' : 'Connect'}</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {sec === 'AI Settings' && (
              <div className="card" style={{ padding: 20 }}>
                <h2 style={{ fontSize: 15, fontWeight: 650, marginBottom: 16 }}>AI Settings</h2>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid var(--border)', marginBottom: 12 }}>
                  <span style={{ fontWeight: 600 }}>AI enabled</span>
                  <Toggle checked={true} onChange={() => toast({ kind: 'success', text: 'AI toggled' })} />
                </div>
                <div>
                  <div className="eyebrow" style={{ marginBottom: 6 }}>Confidence threshold — {settings.confidence}%</div>
                  <input type="range" min={0} max={100} defaultValue={settings.confidence} style={{ width: '100%' }} />
                </div>
              </div>
            )}
            {sec === 'Working Hours' && (
              <div className="card" style={{ padding: 20 }}>
                <h2 style={{ fontSize: 15, fontWeight: 650, marginBottom: 16 }}>Working Hours</h2>
                {['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map(day => (
                  <div key={day} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '8px 0', borderBottom: '1px solid var(--border)' }}>
                    <div style={{ width: 60, fontWeight: 600 }}>{day}</div>
                    <Toggle checked={day !== 'Fri'} onChange={() => toast({ kind: 'success', text: 'Hours updated' })} />
                    <input type="time" className="input mono" style={{ width: 110 }} defaultValue="10:00" />
                    <span>—</span>
                    <input type="time" className="input mono" style={{ width: 110 }} defaultValue="19:00" />
                  </div>
                ))}
              </div>
            )}
            {sec === 'Notifications' && (
              <div className="card" style={{ padding: 20 }}>
                <h2 style={{ fontSize: 15, fontWeight: 650, marginBottom: 16 }}>Notifications</h2>
                {['New lead', 'Order created', 'Appointment booked', 'Escalation', 'Daily summary'].map(n => (
                  <div key={n} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid var(--surface-0)' }}>
                    <span>{n}</span>
                    <div style={{ display: 'flex', gap: 16 }}>
                      <Toggle checked={true} onChange={() => { }} />
                      <Toggle checked={true} onChange={() => { }} />
                    </div>
                  </div>
                ))}
              </div>
            )}
            {sec === 'Team Members' && (
              <div className="card" style={{ padding: 20 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                  <h2 style={{ fontSize: 15, fontWeight: 650 }}>Team Members</h2>
                  <button className="btn btn-primary btn-sm" onClick={() => toast({ kind: 'success', text: 'Invitation sent — simulated' })}>{I.Plus(12)} Invite member</button>
                </div>
                {[
                  { name: 'Mariam Saad', email: 'mariam@seller.club', role: 'Owner' },
                  { name: 'Karim Adel', email: 'karim@seller.club', role: 'Agent' },
                  { name: 'Sara Mounir', email: 'sara@seller.club', role: 'Agent' },
                  { name: 'Yara Fathy', email: 'yara@seller.club', role: 'Viewer' },
                ].map(m => (
                  <div key={m.email} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid var(--surface-0)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><Avatar name={m.name} size={28} /><div><div style={{ fontWeight: 600, fontSize: 13 }}>{m.name}</div><div className="mono faint" style={{ fontSize: 11 }}>{m.email}</div></div></div>
                    <select className="select" style={{ height: 28, width: 100 }} defaultValue={m.role}><option>Owner</option><option>Agent</option><option>Viewer</option></select>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    /* ===== FOLLOWUPS ===== */
    const FollowUps = () => {
      const { followUps, customers, vertical, dispatch, toast } = useApp();
      const list = followUps.filter(f => f.vertical === vertical);
      return (
        <div style={{ padding: 24, maxWidth: 720, margin: '0 auto' }}>
          <h1 style={{ fontSize: 20, fontWeight: 650, marginBottom: 16 }}>Pending Follow-ups</h1>
          {list.length === 0 ? (
            <div className="card" style={{ padding: 24, textAlign: 'center', color: 'var(--ink-600)' }}>No pending follow-ups for this vertical.</div>
          ) : list.map(f => {
            const c = customers.find(x => x.id === f.customerId);
            return (
              <div key={f.id} className="card" style={{ padding: 16, marginBottom: 12, opacity: f.state === 'paused' ? 0.6 : 1 }}>
                <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                  <Avatar name={c.name} size={40} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 13 }}>{c.name}</div>
                    <div className="muted" style={{ fontSize: 12 }}>{f.context}</div>
                    <span className="pill pill-ink" style={{ marginTop: 4, height: 22, display: 'inline-flex', alignItems: 'center', gap: 4 }}>{I.Clock(10)} {f.scheduled}</span>
                  </div>
                  {f.state === 'sent' ? (
                    <span className="pill pill-success">{I.Check(11)} Sent</span>
                  ) : f.state === 'paused' ? (
                    <button className="btn btn-sm" onClick={() => dispatch({ type: 'PAUSE_FOLLOWUP', id: f.id })}>Resume</button>
                  ) : (
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button className="btn btn-sm btn-primary" onClick={() => { dispatch({ type: 'SEND_FOLLOWUP', id: f.id }); toast({ kind: 'success', text: 'Follow-up sent' }); }}>{I.Send(12)} Send now</button>
                      <button className="btn btn-sm" onClick={() => dispatch({ type: 'PAUSE_FOLLOWUP', id: f.id })}>Pause</button>
                      <button className="btn btn-sm" onClick={() => { dispatch({ type: 'CANCEL_FOLLOWUP', id: f.id }); toast({ kind: 'warning', text: 'Follow-up cancelled' }); }}>{I.X(12)} Cancel</button>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    /* ===== TOASTER ===== */
    const Toaster = () => {
      const { toasts, dispatch } = useApp();
      return (
        <div style={{ position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', display: 'flex', flexDirection: 'column', gap: 8, zIndex: 2000 }}>
          {toasts.map(t => (
            <div key={t.id} className="card fade-in" style={{ padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10, minWidth: 280, boxShadow: 'var(--shadow-pop)' }}>
              <span className={'pill ' + (t.kind === 'success' ? 'pill-success' : 'pill-warning')} style={{ width: 22, height: 22, justifyContent: 'center' }}>{t.kind === 'success' ? I.Check(12) : I.Alert(12)}</span>
              <span style={{ flex: 1 }}>{t.text}</span>
              <button className="btn btn-ghost btn-icon" onClick={() => dispatch({ type: 'DISMISS_TOAST', id: t.id })} style={{ width: 24, height: 24 }}>{I.X(14)}</button>
            </div>
          ))}
        </div>
      );
    };

    /* ===== APP ROOT ===== */
    const pages = {
      overview: Overview, inbox: Inbox, customers: Customers, orders: Orders, appointments: Appointments,
      products: Products, services: Services, automations: Automations, knowledge: Knowledge,
      analytics: Analytics, settings: Settings, followups: FollowUps, 'customer-detail': Customers,
    };

    function App() {
      const { onboarded, page, vertical } = useApp();
      if (!onboarded) return <Onboarding />;
      const Page = pages[page] || Overview;
      const accent = vertical === 'appointments' ? 'var(--brand-appt)' : 'var(--brand)';
      const tint = vertical === 'appointments' ? 'var(--brand-appt-tint)' : 'var(--brand-tint)';
      return (
        <div style={{ ['--accent']: accent, ['--accent-tint']: tint, height: '100%' }}>
          <Shell><Page /></Shell>
          <Toaster />
        </div>
      );
    }

    function Root() {
      return <AppProvider><App /></AppProvider>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>

</html>
