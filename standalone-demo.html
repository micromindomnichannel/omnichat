  --brand:#FF5A36;--brand-appt:#52D8A4;

  --success:#52D8A4;--success-bg:rgba(82,216,164,.12);
  --warning:#D94C32;--warning-bg:rgba(217,76,50,.1);

  --font-mono:'JetBrains Mono',"SF Mono",monospace;
  --accent:var(--brand);--accent-tint:var(--brand-tint);
}
.theme-appointments {
  --accent:var(--brand-appt);--accent-tint:var(--brand-appt-tint);
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:var(--font-ui);font-size:13.5px;line-height:1.5;color:var(--ink-900);background:var(--surface-0);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum"}
.tnum{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-400)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface-1);color:var(--ink-900);font-weight:600;font-size:13px;transition:all .15s}
.btn:hover{background:var(--surface-0);border-color:var(--ink-400)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:5px}
.btn-icon{width:32px;height:32px;padding:0;border-radius:6px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.input,.select,.textarea{width:100%;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-1);color:var(--ink-900);font-size:13px;transition:border-color .12s,box-shadow .12s}
.textarea{height:auto;padding:8px 10px;min-height:64px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400)}
.h-title{font-size:18px;font-weight:700;letter-spacing:-0.01em;color:var(--ink-900)}
.muted{color:var(--ink-600)}
.faint{color:var(--ink-400)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill-accent{background:var(--accent-tint);color:var(--accent)}
.pill-ink{background:#EEF0F3;color:var(--ink-700)}
.pill-success{background:var(--success-bg);color:var(--success)}
.pill-warning{background:var(--warning-bg);color:var(--warning)}
.pill-danger{background:var(--danger-bg);color:var(--danger)}
.pill-info{background:var(--info-bg);color:var(--info)}
.fade-in{animation:fadeIn .2s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border-subtle);font-size:13px;vertical-align:middle}
tr:hover td{background:var(--surface-0)}
</style>
</head>

function reducer(s, a) {
  switch (a.type) {
    case 'SET_VERTICAL': return { ...s, vertical: a.v, page: 'overview' };
    case 'SET_ONBOARDED': return { ...s, onboarded: true };
    case 'SET_PAGE': return { ...s, page: a.p };
    case 'OPEN_CUSTOMER': return { ...s, selectedCustomerId: a.id, page: 'customer-detail' };
    case 'SELECT_CONV': return { ...s, selectedConvId: a.id };
    case 'OPEN_DRAWER': return { ...s, activeDrawer: a.drawer, drawerCustomerId: a.customerId || null };
    case 'CLOSE_DRAWER': return { ...s, activeDrawer: null, drawerCustomerId: null };
    case 'SEND_MSG': {
      const conv = s.conversations.find(c => c.id === a.id);
      if (!conv) return s;
      const msg = { id: uid('m'), sender: conv.status === 'human' ? 'human' : 'customer', text: a.text, time: 'now', agent: conv.status === 'human' ? 'MS' : null, rtl: /[\u0600-\u06FF]/.test(a.text) };
      return { ...s, conversations: s.conversations.map(c => c.id === a.id ? { ...c, messages: [...c.messages, msg], lastTime: 'now' } : c) };
    }
    case 'AI_REPLY': return { ...s, conversations: s.conversations.map(c => c.id === a.id ? { ...c, messages: [...c.messages, { id: uid('m'), sender: 'ai', text: a.text, time: 'now', rtl: /[\u0600-\u06FF]/.test(a.text) }] } : c) };
    case 'TAKE_OVER': return { ...s, conversations: s.conversations.map(c => c.id === a.id ? { ...c, status: 'human', messages: [...c.messages, { id: uid('m'), sender: 'system', text: 'You are now handling this conversation.', time: 'now' }] } : c) };
    case 'RETURN_AI': return { ...s, conversations: s.conversations.map(c => c.id === a.id ? { ...c, status: 'ai', messages: [...c.messages, { id: uid('m'), sender: 'system', text: 'AI is now handling this conversation.', time: 'now' }] } : c) };
    case 'CREATE_ORDER': {
      const newId = String(1049 + s.orders.length - 5);
      const order = { ...a.order, id: newId, status: 'Confirmed', createdAt: '2024-08-17 now' };
      return { ...s, orders: [order, ...s.orders], conversations: s.conversations.map(c => c.customerId === a.order.customerId ? { ...c, messages: [...c.messages, { id: uid('m'), sender: 'system', text: 'Order #' + newId + ' created successfully', time: 'now' }] } : c) };
    }
    case 'UPDATE_ORDER_STATUS': return { ...s, orders: s.orders.map(o => o.id === a.id ? { ...o, status: a.status } : o) };
    case 'SEND_LOGISTICS': return { ...s, orders: s.orders.map(o => o.id === a.id ? { ...o, status: 'Processing' } : o) };
    case 'CREATE_APPT': {
      const newId = 'A-' + String(1043 + s.appointments.length - 4);
      const appt = { ...a.appt, id: newId, status: 'Confirmed', createdAt: '2024-08-17 now' };
      return { ...s, appointments: [appt, ...s.appointments], conversations: s.conversations.map(c => c.customerId === a.appt.customerId ? { ...c, messages: [...c.messages, { id: uid('m'), sender: 'system', text: 'Appointment ' + newId + ' confirmed', time: 'now' }] } : c) };
    }
    case 'UPDATE_APPT_STATUS': return { ...s, appointments: s.appointments.map(x => x.id === a.id ? { ...x, status: a.status } : x) };
    case 'TOGGLE_AUTOMATION': return { ...s, automations: s.automations.map(x => x.id === a.id ? { ...x, enabled: !x.enabled } : x) };
    case 'TOGGLE_VARIANT': return { ...s, products: s.products.map(p => p.id === a.pid ? { ...p, variants: p.variants.map(v => v.label === a.label ? { ...v, available: !v.available } : v) } : p) };
    case 'TOGGLE_CHANNEL': return { ...s, settings: { ...s.settings, channels: { ...s.settings.channels, [a.ch]: !s.settings.channels[a.ch] } } };
    case 'UPDATE_BIZ': return { ...s, settings: { ...s.settings, ...a.payload } };
    case 'ADD_FAQ': return { ...s, faqs: [...s.faqs, { id: uid('F'), q: a.q, a: a.a }] };
    case 'TOAST': return { ...s, toasts: [...s.toasts, { id: uid('t'), ...a.toast }] };
    case 'SEND_FOLLOWUP': return { ...s, followUps: s.followUps.map(f => f.id === a.id ? { ...f, state: 'sent', scheduled: 'Sent just now' } : f) };
    case 'PAUSE_FOLLOWUP': return { ...s, followUps: s.followUps.map(f => f.id === a.id ? { ...f, state: f.state === 'paused' ? 'pending' : 'paused' } : f) };
    case 'CANCEL_FOLLOWUP': return { ...s, followUps: s.followUps.filter(f => f.id !== a.id) };
    case 'UPDATE_WORKING_HOURS': return { ...s, workingHours: s.workingHours.map(wh => wh.day === a.day ? { ...wh, [a.field]: a.val } : wh) };
    case 'INVITE_TEAM_MEMBER': return { ...s, teamMembers: [...s.teamMembers, { id: uid('TM'), name: a.name, email: a.email, role: a.role, status: 'Active' }] };
    case 'TOGGLE_NOTIFICATION': return { ...s, notifications: s.notifications.map(n => n.event === a.event ? { ...n, [a.channel]: !n[a.channel] } : n) };
    default: return s;
  }
}

function AppProvider({ children }) {
  const [state, dispatch] = useReducer(reducer, initialState);
  const toast = (t) => {
    const id = uid('t');
    dispatch({ type: 'TOAST', toast: t });
    setTimeout(() => dispatch({ type: 'DISMISS_TOAST', id }), 4000);
  };
  return <AppCtx.Provider value={{ ...state, dispatch, toast }}>{children}</AppCtx.Provider>;
}

const LineChart = ({ data, data2, height = 200 }) => {
  const w = 600;
  const max = Math.max(...data, ...(data2 || []), 1);
  const pts = arr => arr.map((v, i) => (i / (arr.length - 1)) * w + ',' + (height - (v / max) * (height - 30) - 15)).join(' ');
  return (
    <svg viewBox={'0 0 ' + w + ' ' + height} style={{ width: '100%', height, overflow: 'visible' }}>
      <defs>
        <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.2"/>
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={'0,' + (height - 15) + ' ' + pts(data) + ' ' + w + ',' + (height - 15)} fill="url(#g1)" />
      <polyline points={pts(data)} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {data2 && <polyline points={pts(data2)} fill="none" stroke="var(--ink-400)" strokeWidth="1.5" strokeDasharray="4 4" />}
    </svg>
  );
};

const ConversationList = () => {
  const { conversations, customers, selectedConvId, dispatch } = useApp();
  const [filter, setFilter] = useState('all');
  const [q, setQ] = useState('');
  const filters = [
    {id:'all',label:'All'},{id:'unread',label:'Unread'},{id:'ai',label:'AI Active'},
    {id:'human',label:'Needs Human'},{id:'high-intent',label:'High Intent'}
  ];
  const filtered = conversations.filter(c => {
    if (filter === 'unread' && !c.unread) return false;
    if (filter === 'ai' && c.status !== 'ai') return false;
    if (filter === 'human' && c.status !== 'human') return false;
    if (filter === 'high-intent' && !c.intent.includes('High') && !c.intent.includes('Booking')) return false;
    const cust = customers.find(x => x.id === c.customerId);
    if (q && !(cust.name + ' ' + c.messages.map(m => m.text).join(' ')).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: 'var(--surface-1)', borderRight: '1px solid var(--border)', width: 320, flexShrink: 0 }}>
      <div style={{ padding: 12, borderBottom: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ position: 'relative' }}>
          <span style={{ position: 'absolute', left: 10, top: 10, color: 'var(--ink-400)', display: 'inline-flex' }}>{I.Search(14)}</span>
          <input className="input" style={{ height: 34, paddingLeft: 30 }} placeholder="Search inbox…" value={q} onChange={e => setQ(e.target.value)} />
        </div>
        <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 2 }}>
          {filters.map(p => (
            <button key={p.id} onClick={() => setFilter(p.id)} className={'btn btn-sm ' + (filter === p.id ? 'btn-primary' : '')} style={{ height: 26, whiteSpace: 'nowrap', flexShrink: 0, padding: '0 8px', fontSize: 11.5, ...(filter === p.id ? {} : { background: 'var(--surface-1)', color: 'var(--ink-700)' }) }}>{p.label}</button>
          ))}
        </div>
      </div>
      <div style={{ flex: 1, overflow: 'auto' }}>
        {filtered.map(c => {
          const cust = customers.find(x => x.id === c.customerId) || { name: 'Unknown' };
          const last = c.messages[c.messages.length - 1] || { text: '' };
          const selected = c.id === selectedConvId;
          return (
            <div key={c.id} onClick={() => dispatch({ type: 'SELECT_CONV', id: c.id })} style={{ display: 'flex', gap: 10, padding: '12px 14px', cursor: 'pointer', position: 'relative', background: selected ? 'var(--accent-tint)' : 'transparent', borderLeft: selected ? '3px solid var(--accent)' : '3px solid transparent', borderBottom: '1px solid var(--border-subtle)' }}>
              <div style={{ position: 'relative' }}>
                <Avatar name={cust.name} size={38} />
                <div style={{ position: 'absolute', right: -2, bottom: -2, background: 'var(--surface-1)', borderRadius: '50%', padding: 2, boxShadow: '0 1px 2px rgba(0,0,0,0.1)' }}><ChannelGlyph ch={c.channel} size={13} /></div>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontWeight: 650, fontSize: 13.5, color: 'var(--ink-900)' }}>{cust.name}</span>
                  <span className="faint" style={{ fontSize: 11 }}>{c.lastTime}</span>
                </div>
                <div className="muted" style={{ fontSize: 12.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginTop: 2 }}>{last.sender === 'system' ? <em style={{ color: 'var(--ink-400)' }}>{last.text}</em> : last.text}</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4 }}>
                  {c.status === 'ai' ? (
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 10.5, color: 'var(--accent)', fontWeight: 700 }}><span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--accent)' }} />AI Active</span>
                  ) : (
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 10.5, color: 'var(--ink-600)', fontWeight: 600 }}>{I.User(11)} Human</span>
                  )}
                  {c.intent.includes('High') && <span className="pill pill-warning" style={{ height: 18, fontSize: 9.5, padding: '0 6px' }}>High Intent</span>}
                  {c.unread > 0 && <span style={{ marginLeft: 'auto', background: 'var(--danger)', color: '#fff', borderRadius: 999, fontSize: 10, fontWeight: 700, padding: '0 6px', height: 16, display: 'inline-flex', alignItems: 'center' }}>{c.unread}</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const ConversationThread = () => {
  const { conversations, customers, selectedConvId, dispatch, toast } = useApp();
  const conv = conversations.find(c => c.id === selectedConvId);
  const [text, setText] = useState('');
  const endRef = useRef(null);

  useEffect(() => {
    endRef.current && endRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [conv ? conv.messages.length : 0]);

  if (!conv) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-400)' }}>Select a conversation from inbox</div>;

  const cust = customers.find(c => c.id === conv.customerId) || { name: 'Customer' };
  const send = () => {
    if (text.trim()) {
      dispatch({ type: 'SEND_MSG', id: conv.id, text: text.trim() });
      const entered = text.trim();
      setText('');
      if (conv.status === 'ai') {
        setTimeout(() => {
          const replies = [
            'Got it! Let me check the stock and pricing right away for you.',
            'Sure thing! I can create your order with Cash on Delivery anytime.',
            'Understood! I have reserved your request in our system.',
            'تمام يا فندم، متاح وجاهز للشحن فوراً، تحب أسجل لحضرتك الأوردر؟'
          ];
          dispatch({ type: 'AI_REPLY', id: conv.id, text: replies[Math.floor(Math.random() * replies.length)] });
        }, 900);
      }
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', flex: 1, minWidth: 0, background: 'var(--surface-0)' }}>
      <div style={{ height: 56, padding: '0 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'var(--surface-1)', borderBottom: '1px solid var(--border)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Avatar name={cust.name} size={34} />
          <div>
            <div style={{ fontWeight: 700, fontSize: 14 }}>{cust.name}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, color: 'var(--ink-600)' }}><ChannelGlyph ch={conv.channel} size={12} /> <span style={{ textTransform: 'capitalize' }}>{conv.channel}</span> · {conv.intent}</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span className={'pill ' + (conv.status === 'ai' ? 'pill-accent' : 'pill-ink')}>{conv.status === 'ai' ? <>{I.Robot(11)} AI Copilot Auto-Pilot</> : <>{I.User(11)} Human Controlled</>}</span>
          {conv.status === 'ai' ? (
            <button className="btn btn-sm" style={{ borderColor: 'var(--accent)', color: 'var(--accent)' }} onClick={() => { dispatch({ type: 'TAKE_OVER', id: conv.id }); toast({ kind: 'info', text: 'You have taken over this thread.' }); }}>Take over</button>
          ) : (
            <button className="btn btn-sm" onClick={() => { dispatch({ type: 'RETURN_AI', id: conv.id }); toast({ kind: 'success', text: 'AI copilot resumed handling this thread.' }); }}>Return to AI</button>
          )}
        </div>
      </div>
      <div style={{ flex: 1, overflow: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {conv.messages.map(m => {
          if (m.sender === 'system') {
            return (
              <div key={m.id} className="fade-in" style={{ display: 'flex', justifyContent: 'center', margin: '4px 0' }}>
                <span className="pill pill-ink" style={{ background: 'var(--surface-1)', border: '1px solid var(--border)', color: 'var(--ink-600)', fontSize: 11, padding: '0 10px', height: 24 }}>{I.Sparkles(11)} {m.text}</span>
              </div>
            );
          }
          const isCustomer = m.sender === 'customer';
          const isAI = m.sender === 'ai';
          return (
            <div key={m.id} className="fade-in" style={{ display: 'flex', flexDirection: 'column', alignItems: isCustomer ? 'flex-start' : 'flex-end', maxWidth: '100%' }}>
              {(isAI || m.sender === 'human') && <span className="eyebrow" style={{ marginBottom: 2, color: isAI ? 'var(--accent)' : 'var(--ink-700)', fontSize: 10 }}>{isAI ? '⚡ AI Copilot' : (m.agent || 'Support Agent')}</span>}
              <div style={{ maxWidth: 460, padding: '9px 13px', borderRadius: 10, fontSize: 13.5, lineHeight: 1.45, background: isCustomer ? 'var(--surface-1)' : isAI ? 'var(--accent-tint)' : 'var(--ink-900)', color: isCustomer ? 'var(--ink-900)' : isAI ? 'var(--ink-900)' : '#fff', border: isCustomer ? '1px solid var(--border)' : isAI ? '1px solid var(--accent)' : 'none', direction: m.rtl ? 'rtl' : 'ltr', textAlign: m.rtl ? 'right' : 'left' }}>{m.text}</div>
              <span className="faint" style={{ fontSize: 10, marginTop: 2 }}>{m.time}</span>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>
      <div style={{ padding: 12, background: 'var(--surface-1)', borderTop: '1px solid var(--border)' }}>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <input className="input" style={{ height: 42 }} placeholder={conv.status === 'ai' ? 'Type message (or press enter to send as customer / test AI)...' : 'Type your reply…'} value={text} onChange={e => setText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') send(); }} />
          <button className="btn btn-primary" style={{ height: 42, width: 44, padding: 0 }} disabled={!text.trim()} onClick={send}>{I.Send(16)}</button>
        </div>
      </div>
    </div>
  );
};

            <div className="pill pill-ink" style={{ fontSize: 12, padding: '6px 12px' }}>Egyptian Arabic (Franco & Arabic Script) + Modern Standard Arabic + English</div>
          </div>

          <button className="btn btn-primary" style={{ alignSelf: 'flex-start' }} onClick={() => { dispatch({ type: 'UPDATE_BIZ', payload: { confidence: conf } }); toast({ kind: 'success', text: 'AI parameters saved!' }); }}>Update AI Guardrails</button>
        </div>
      )}

      {/* Tab 4: Working Hours */}
      {tab === 'hours' && (
        <div className="card" style={{ padding: 22, display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div className="eyebrow">Operating Hours & Customer Support Schedule</div>
          <p className="faint" style={{ fontSize: 11.5, margin: '-6px 0 10px' }}>AI will continue to reply 24/7, but will inform customers when human agents are out of office.</p>
          {(workingHours || []).map(wh => (
            <div key={wh.day} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 14px', borderRadius: 8, background: 'var(--surface-0)', border: '1px solid var(--border)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <Toggle checked={wh.open} onChange={() => dispatch({ type: 'UPDATE_WORKING_HOURS', day: wh.day, field: 'open', val: !wh.open })} />
                <span style={{ fontWeight: 650, fontSize: 13, width: 100 }}>{wh.day}</span>
              </div>
              {wh.open ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <input type="time" value={wh.start} onChange={e => dispatch({ type: 'UPDATE_WORKING_HOURS', day: wh.day, field: 'start', val: e.target.value })} style={{ height: 30, padding: '0 8px', borderRadius: 6, border: '1px solid var(--border)', background: 'var(--surface-1)', fontSize: 12 }} />
                  <span className="faint" style={{ fontSize: 12 }}>to</span>
                  <input type="time" value={wh.end} onChange={e => dispatch({ type: 'UPDATE_WORKING_HOURS', day: wh.day, field: 'end', val: e.target.value })} style={{ height: 30, padding: '0 8px', borderRadius: 6, border: '1px solid var(--border)', background: 'var(--surface-1)', fontSize: 12 }} />
                </div>
              ) : (
                <span className="pill pill-ink" style={{ fontSize: 11 }}>Closed</span>
              )}
            </div>
          ))}
          <button className="btn btn-primary" style={{ alignSelf: 'flex-start', marginTop: 8 }} onClick={() => toast({ kind: 'success', text: 'Working hours saved!' })}>Save Working Schedule</button>
        </div>
      )}

      {/* Tab 5: Team Members */}
      {tab === 'team' && (
        <div className="card" style={{ padding: 22, display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <div className="eyebrow">Team Members & Access Control</div>
              <div className="faint" style={{ fontSize: 11.5, marginTop: 2 }}>Manage staff access to inbox, CRM, and order fulfillment.</div>
            </div>
            <button className="btn btn-primary btn-sm" onClick={() => setInviteOpen(true)}>{I.Plus(14)} Invite Member</button>
          </div>

          <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 8 }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--border)', textAlign: 'left', fontSize: 11, color: 'var(--ink-400)' }}>
                <th style={{ padding: '8px 12px' }}>NAME</th>
                <th style={{ padding: '8px 12px' }}>EMAIL</th>
                <th style={{ padding: '8px 12px' }}>ROLE</th>
                <th style={{ padding: '8px 12px' }}>STATUS</th>
              </tr>
            </thead>
            <tbody>
              {(teamMembers || []).map(m => (
                <tr key={m.id} style={{ borderBottom: '1px solid var(--border-subtle)', fontSize: 12.5 }}>
                  <td style={{ padding: '12px', fontWeight: 650 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Avatar name={m.name} size={26} />
                      {m.name}
                    </div>
                  </td>
                  <td style={{ padding: '12px', color: 'var(--ink-600)' }} className="mono">{m.email}</td>
                  <td style={{ padding: '12px' }}>
                    <span className="pill pill-ink" style={{ fontSize: 10.5 }}>{m.role}</span>
                  </td>
                  <td style={{ padding: '12px' }}>
                    <span style={{ fontSize: 11.5, fontWeight: 700, color: m.status === 'Active' ? 'var(--success)' : 'var(--warning)' }}>● {m.status}</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          {inviteOpen && (
            <div style={{ padding: 16, borderRadius: 8, background: 'var(--surface-0)', border: '1px solid var(--accent)', marginTop: 8, display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{ fontWeight: 700, fontSize: 13 }}>Invite New Team Member</div>
              <div style={{ display: 'flex', gap: 10 }}>
                <input className="input" placeholder="Full Name" value={invName} onChange={e => setInvName(e.target.value)} style={{ flex: 1 }} />
                <input className="input" placeholder="Email Address" value={invEmail} onChange={e => setInvEmail(e.target.value)} style={{ flex: 1 }} />
                <select className="input" value={invRole} onChange={e => setInvRole(e.target.value)} style={{ width: 120 }}>
                  <option>Owner</option>
                  <option>Agent</option>
                  <option>Viewer</option>
                </select>
              </div>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                <button className="btn btn-ghost btn-sm" onClick={() => setInviteOpen(false)}>Cancel</button>
                <button className="btn btn-primary btn-sm" disabled={!invName || !invEmail} onClick={() => {
                  dispatch({ type: 'INVITE_TEAM_MEMBER', name: invName, email: invEmail, role: invRole });
                  setInviteOpen(false);
                  setInvName('');
                  setInvEmail('');
                  toast({ kind: 'success', text: 'Invitation sent to ' + invEmail });
                }}>Send Invitation</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Tab 6: Notifications */}
      {tab === 'notifications' && (
        <div className="card" style={{ padding: 22, display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div className="eyebrow">Real-Time Notification Preferences</div>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--border)', textAlign: 'left', fontSize: 11, color: 'var(--ink-400)' }}>
                <th style={{ padding: '8px 12px' }}>EVENT TRIGGER</th>
                <th style={{ padding: '8px 12px', textAlign: 'center' }}>EMAIL NOTIFICATION</th>
                <th style={{ padding: '8px 12px', textAlign: 'center' }}>IN-APP POPUP</th>
              </tr>
            </thead>
            <tbody>
              {(notifications || []).map(n => (
                <tr key={n.event} style={{ borderBottom: '1px solid var(--border-subtle)', fontSize: 13 }}>
                  <td style={{ padding: '12px', fontWeight: 600 }}>{n.event}</td>
                  <td style={{ padding: '12px', textAlign: 'center' }}>
                    <input type="checkbox" checked={n.email} onChange={() => dispatch({ type: 'TOGGLE_NOTIFICATION', event: n.event, channel: 'email' })} style={{ cursor: 'pointer' }} />
                  </td>
                  <td style={{ padding: '12px', textAlign: 'center' }}>
                    <input type="checkbox" checked={n.inApp} onChange={() => dispatch({ type: 'TOGGLE_NOTIFICATION', event: n.event, channel: 'inApp' })} style={{ cursor: 'pointer' }} />
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <button className="btn btn-primary" style={{ alignSelf: 'flex-start', marginTop: 8 }} onClick={() => toast({ kind: 'success', text: 'Notification preferences saved!' })}>Save Preferences</button>
        </div>
      )}
    </div>
  );
};

/* ============ ONBOARDING WIZARD ============ */
const Onboarding = () => {
  const { dispatch } = useApp();
  const [step, setStep] = useState(0);
  const [vertical, setVertical] = useState('commerce');
  const [bizName, setBizName] = useState('SELLER Demo Store');
  const steps = ['Vertical','Business','Channels','Knowledge','Review','Finish'];

  return (
    <div style={{ minHeight: '100vh', background: 'var(--surface-0)', padding: '40px 24px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ width: 680, maxWidth: '100%' }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 32 }}>
          {steps.map((s, i) => <div key={s} style={{ flex: 1, height: 4, background: i <= step ? 'var(--accent)' : 'var(--ink-200)', borderRadius: 2 }} />)}
        </div>

        {step === 0 && (
          <div className="card" style={{ padding: 32, textAlign: 'center' }}>
            <h1 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>Choose your SELLER solution</h1>
            <p className="muted" style={{ margin: '8px 0 32px' }}>One platform. Two specialized AI workflows to turn conversations into revenue.</p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              <div className="card" style={{ padding: 20, cursor: 'pointer', border: vertical === 'commerce' ? '2px solid var(--brand)' : '1px solid var(--border)', textAlign: 'left' }} onClick={() => setVertical('commerce')}>
                <div style={{ height: 64, background: 'var(--brand-tint)', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--brand)', marginBottom: 12 }}>{I.Bag(32)}</div>
                <div style={{ fontSize: 16, fontWeight: 700 }}>Commerce</div>
                <p className="muted" style={{ fontSize: 12, margin: '4px 0 0' }}>For D2C brands, online shops & retailers collecting COD orders.</p>
              </div>
              <div className="card" style={{ padding: 20, cursor: 'pointer', border: vertical === 'appointments' ? '2px solid var(--brand-appt)' : '1px solid var(--border)', textAlign: 'left' }} onClick={() => setVertical('appointments')}>
                <div style={{ height: 64, background: 'var(--brand-appt-tint)', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--brand-appt)', marginBottom: 12 }}>{I.Calendar(32)}</div>
                <div style={{ fontSize: 16, fontWeight: 700 }}>Appointments</div>
                <p className="muted" style={{ fontSize: 12, margin: '4px 0 0' }}>For clinics, dental centers, salons & service professionals.</p>
              </div>
            </div>
            <button className="btn btn-primary btn-block" style={{ marginTop: 24 }} onClick={() => setStep(1)}>Continue with {vertical === 'commerce' ? 'Commerce' : 'Appointments'}</button>
          </div>
        )}

        {step === 1 && (
          <div className="card" style={{ padding: 32 }}>
            <h2 style={{ fontSize: 18, fontWeight: 750, margin: '0 0 16px' }}>Business Information</h2>
            <div style={{ marginBottom: 14 }}>
              <div className="eyebrow" style={{ marginBottom: 6 }}>Business or Clinic Name</div>
              <input className="input" value={bizName} onChange={e => setBizName(e.target.value)} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 24 }}>
              <button className="btn" onClick={() => setStep(0)}>Back</button>
              <button className="btn btn-primary" onClick={() => setStep(2)}>Continue</button>
            </div>
          </div>
        )}

        {step >= 2 && step < 5 && (
          <div className="card" style={{ padding: 32, textAlign: 'center' }}>
            <div style={{ width: 56, height: 56, margin: '0 auto 16px', borderRadius: '50%', background: 'var(--accent-tint)', color: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{I.Sparkles(28)}</div>
            <h2 style={{ fontSize: 18, fontWeight: 750, margin: 0 }}>Connecting Channels & Seeding Knowledge</h2>
            <p className="muted" style={{ margin: '8px 0 24px' }}>Connecting Instagram DM, WhatsApp Cloud API, and indexing initial catalog.</p>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <button className="btn" onClick={() => setStep(step - 1)}>Back</button>
              <button className="btn btn-primary" onClick={() => setStep(step + 1)}>Next Step</button>
            </div>
          </div>
        )}

        {step === 5 && (
          <div className="card" style={{ padding: 32, textAlign: 'center' }}>
            <div style={{ width: 64, height: 64, margin: '0 auto 16px', borderRadius: '50%', background: 'var(--success-bg)', color: 'var(--success)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{I.Check(32)}</div>
            <h2 style={{ fontSize: 20, fontWeight: 800, margin: 0 }}>You are all set!</h2>
            <p className="muted" style={{ margin: '8px 0 24px' }}>Your AI Omnichannel platform is primed and ready.</p>
            <button className="btn btn-primary btn-block" onClick={() => { dispatch({ type: 'UPDATE_BIZ', payload: { businessName: bizName } }); dispatch({ type: 'SET_VERTICAL', v: vertical }); dispatch({ type: 'SET_ONBOARDED' }); }}>Enter SELLER Dashboard</button>
          </div>
        )}
      </div>
    </div>
  );
};

/* ============ MAIN SHELL & TOPBAR ============ */
const Sidebar = () => {
  const { vertical, page, conversations, dispatch } = useApp();
  const [switcherOpen, setSwitcherOpen] = useState(false);
  const isAppt = vertical === 'appointments';
  const unread = conversations.reduce((a, c) => a + c.unread, 0);

  const navByVertical = {
    commerce: [
      { id: 'orders', label: 'Orders', icon: 'Bag' },
      { id: 'products', label: 'Products', icon: 'Box' }
    ],
    appointments: [
      { id: 'appointments', label: 'Appointments', icon: 'Calendar' },
      { id: 'services', label: 'Services', icon: 'Box' }
    ],
  };

  const items = [
    { id: 'overview', label: 'Overview', icon: 'Layout' },
    { id: 'inbox', label: 'Inbox', icon: 'Inbox', badge: true },
    { id: 'customers', label: 'Customers', icon: 'Users' },
    ...navByVertical[vertical],
    { id: 'automations', label: 'Automations', icon: 'Zap' },
    { id: 'knowledge', label: 'Knowledge Base', icon: 'Book' },
    { id: 'analytics', label: 'Analytics', icon: 'Chart' },
  ];

  const NavBtn = ({ item }) => {
    const active = page === item.id || (page === 'customer-detail' && item.id === 'customers');
    const Ico = I[item.icon] || I.Layout;
    return (
      <button onClick={() => dispatch({ type: 'SET_PAGE', p: item.id })} className="btn-ghost" style={{ display: 'flex', alignItems: 'center', gap: 12, height: 38, padding: '0 14px', borderRadius: 6, background: active ? 'var(--accent-tint)' : 'transparent', color: active ? 'var(--accent)' : 'var(--ink-700)', borderLeft: active ? '3px solid var(--accent)' : '3px solid transparent', fontWeight: active ? 700 : 500, justifyContent: 'flex-start', width: '100%' }}>
        {Ico(18)}
        <span style={{ fontSize: 13 }}>{item.label}</span>
        {item.badge && unread > 0 && <span style={{ marginLeft: 'auto', background: 'var(--danger)', color: '#fff', borderRadius: 999, fontSize: 10, fontWeight: 700, padding: '0 6px', height: 16, display: 'inline-flex', alignItems: 'center' }}>{unread}</span>}
      </button>
    );
  };

  return (
    <div style={{ width: 230, background: 'var(--surface-1)', borderRight: '1px solid var(--border)', height: '100%', display: 'flex', flexDirection: 'column', flexShrink: 0 }}>
      <div style={{ padding: '16px 14px 12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
          <div style={{ width: 28, height: 28, borderRadius: 6, background: 'var(--accent)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 14 }}>S</div>
          <div style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-0.02em', color: 'var(--ink-900)' }}>SELLER</div>
        </div>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setSwitcherOpen(!switcherOpen)} style={{ width: '100%', height: 34, background: 'var(--surface-0)', border: '1px solid var(--border)', borderRadius: 6, padding: '0 10px', display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'space-between', cursor: 'pointer' }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12.5, fontWeight: 650, color: 'var(--accent)' }}>{isAppt ? I.Calendar(14) : I.Bag(14)} {vertical === 'commerce' ? 'Commerce' : 'Appointments'}</span>
            {I.Chevron(14)}
          </button>
          {switcherOpen && (
            <div className="card fade-in" style={{ position: 'absolute', top: 38, left: 0, right: 0, zIndex: 100, padding: 4, boxShadow: 'var(--shadow-pop)' }}>
              {['commerce','appointments'].map(v => (
                <button key={v} className="btn-ghost" onClick={() => { dispatch({ type: 'SET_VERTICAL', v }); setSwitcherOpen(false); }} style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 8, height: 34, padding: '0 8px', borderRadius: 6, justifyContent: 'space-between', fontWeight: 600, fontSize: 12.5 }}>
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>{v === 'commerce' ? I.Bag(14) : I.Calendar(14)} {v === 'commerce' ? 'Commerce' : 'Appointments'}</span>
                  {vertical === v && <span style={{ color: 'var(--accent)' }}>{I.Check(14)}</span>}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
      <div style={{ flex: 1, padding: '4px 12px', display: 'flex', flexDirection: 'column', gap: 2, overflowY: 'auto' }}>
        {items.map(item => <NavBtn key={item.id} item={item} />)}
      </div>
      <div style={{ borderTop: '1px solid var(--border)', padding: '8px 12px', display: 'flex', flexDirection: 'column', gap: 2 }}>
        <button onClick={() => dispatch({ type: 'SET_PAGE', p: 'followups' })} className="btn-ghost" style={{ display: 'flex', alignItems: 'center', gap: 12, height: 36, padding: '0 14px', borderRadius: 6, justifyContent: 'flex-start', width: '100%', color: page === 'followups' ? 'var(--accent)' : 'var(--ink-600)', fontWeight: page === 'followups' ? 700 : 500 }}>{I.Bell(16)}<span style={{ fontSize: 12.5 }}>Follow-ups Queue</span></button>
        <button onClick={() => dispatch({ type: 'SET_PAGE', p: 'settings' })} className="btn-ghost" style={{ display: 'flex', alignItems: 'center', gap: 12, height: 36, padding: '0 14px', borderRadius: 6, justifyContent: 'flex-start', width: '100%', color: page === 'settings' ? 'var(--accent)' : 'var(--ink-600)', fontWeight: page === 'settings' ? 700 : 500 }}>{I.Cog(16)}<span style={{ fontSize: 12.5 }}>Settings</span></button>
      </div>
    </div>
  );
};

const TopBar = () => {
  const { page, settings, vertical, dispatch } = useApp();
  const titleMap = {
    overview:'Overview', inbox:'Omnichannel Inbox', customers:'Customers CRM',
    orders:'Orders Management', appointments:'Appointments Agenda', products:'Product Catalog',
    services:'Services Menu', automations:'Automations & Workflows', knowledge:'AI Knowledge & Playground',
    analytics:'Analytics & Reports', settings:'Settings', followups:'Follow-ups Queue', 'customer-detail':'Customer CRM'
  };

  return (
    <div style={{ height: 58, padding: '0 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'var(--surface-1)', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <div className="h-title">{titleMap[page] || 'Overview'}</div>
        <span className="pill pill-ink" style={{ fontSize: 10.5, textTransform: 'capitalize' }}>{vertical} Mode</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{ position: 'relative', width: 280 }}>
          <span style={{ position: 'absolute', left: 10, top: 9, color: 'var(--ink-400)', display: 'inline-flex' }}>{I.Search(14)}</span>
          <input className="input" style={{ height: 34, paddingLeft: 30, background: 'var(--surface-0)' }} placeholder="Quick search conversations…" />
        </div>
        <button className="btn btn-ghost btn-icon" onClick={() => dispatch({ type: 'SET_PAGE', p: 'followups' })}>
          {I.Bell(18)}
        </button>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }} onClick={() => dispatch({ type: 'SET_PAGE', p: 'settings' })}>
          <Avatar name={settings.businessName} size={32} />
          <div>
            <div style={{ fontSize: 12, fontWeight: 700 }}>{settings.businessName}</div>
            <div className="faint" style={{ fontSize: 10 }}>Admin Owner</div>
          </div>
        </div>
      </div>
    </div>
  );
};

const Shell = ({ children }) => (
  <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
    <Sidebar />
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>
      <TopBar />
      <div style={{ flex: 1, overflow: 'auto', background: 'var(--surface-0)' }}>{children}</div>
    </div>
  </div>
);

/* ============ MAIN APP CONTAINER ============ */
const App = () => {
  const { onboarded, page, vertical, activeDrawer, drawerCustomerId, dispatch } = useApp();

  // Dynamic vertical theme class
  useEffect(() => {
    document.body.className = vertical === 'appointments' ? 'theme-appointments' : '';
  }, [vertical]);

  if (!onboarded) return <Onboarding />;

  return (
    <>
      <Shell>
        {page === 'overview' && <OverviewView />}
        {page === 'inbox' && <InboxView />}
        {page === 'customers' && <CustomersView />}
        {page === 'customer-detail' && <CustomerDetailView />}
        {page === 'orders' && <OrdersView />}
        {page === 'appointments' && <AppointmentsView />}
        {page === 'products' && <ProductsView />}
        {page === 'services' && <ServicesView />}
        {page === 'automations' && <AutomationsView />}
        {page === 'knowledge' && <KnowledgeView />}
        {page === 'analytics' && <AnalyticsView />}
        {page === 'followups' && <FollowUpsView />}
        {page === 'settings' && <SettingsView />}
      </Shell>

      {activeDrawer === 'order' && <OrderDrawer customerId={drawerCustomerId} onClose={() => dispatch({ type: 'CLOSE_DRAWER' })} />}
      {activeDrawer === 'booking' && <BookingDrawer customerId={drawerCustomerId} onClose={() => dispatch({ type: 'CLOSE_DRAWER' })} />}
      <ToastContainer />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider>
    <App />
  </AppProvider>
);
</script>
</body>
</html>
